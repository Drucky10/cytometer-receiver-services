name: Build & release v3 .exe

# Builds CytometerReceiver.exe from the PRIVATE source repo and publishes it as a
# Release asset in THIS public repo — so end users download new versions here,
# while the source stays private.
#
# One-time setup: add a repository secret SOURCE_TOKEN = a Personal Access Token
# that can read the private repo Drucky10/cytometer-receiver (classic scope "repo",
# or fine-grained "Contents: Read" for that repo). See README.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v3.0.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the Release in this repo

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Drucky10/cytometer-receiver
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + PyInstaller
        working-directory: cytometer-receiver-client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build CytometerReceiver.exe
        working-directory: cytometer-receiver-client
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name CytometerReceiver
          --add-data "..\cytometer-receiver-user-manual;cytometer-receiver-user-manual"
          main.py

      - name: Publish Release (with the .exe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: cytometer-receiver-client/dist/CytometerReceiver.exe
          generate_release_notes: true
