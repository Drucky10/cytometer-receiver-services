name: Build & release desktop apps

# Builds the desktop apps from the PRIVATE source repo and publishes them as
# Release assets in THIS public repo, so end users download new versions here
# while the source stays private:
#   • CytometerReceiver.exe — the main cytometer app
#   • DruckAI.exe           — the standalone AI assistant (agent) desktop app
#
# One-time setup: add a repository secret SOURCE_TOKEN = a Personal Access Token
# that can read the private repo Drucky10/cytometer-receiver. See README.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v3.0.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Drucky10/cytometer-receiver
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CytometerReceiver.exe
        working-directory: cytometer-receiver-client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name CytometerReceiver --icon icon.ico --add-data "icon.ico;." --add-data "..\cytometer-receiver-user-manual;cytometer-receiver-user-manual" main.py

      - name: Build DruckAI.exe (AI assistant)
        working-directory: cytometer-ai-assistant
        run: |
          pip install -r requirements.txt
          pyinstaller --noconfirm --onefile --windowed --name DruckAI --icon icon.ico --add-data "icon.ico;." main.py

      - name: Publish Release (both apps)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            cytometer-receiver-client/dist/CytometerReceiver.exe
            cytometer-ai-assistant/dist/DruckAI.exe
